name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m pytest
      - name: Smoke test CLI
        run: |
          stable-asr doctor
          stable-asr roadmap-status --roadmap configs/roadmap/stable_asr_roadmap.json --validate-only
          stable-asr validate-manifest examples/data/turn_demo.jsonl
          stable-asr labels
          stable-asr profile-turn-data --dataset examples/data/turn_demo.jsonl --report /tmp/stable-asr-turn-profile.md
          stable-asr split-turn-data --input examples/data/turn_demo.jsonl --output-dir /tmp/stable-asr-splits --train-ratio 0.5 --dev-ratio 0.25 --test-ratio 0.25 --seed 7
          stable-asr audit-turn-splits --train /tmp/stable-asr-splits/turn_train.jsonl --dev /tmp/stable-asr-splits/turn_dev.jsonl --test /tmp/stable-asr-splits/turn_test.jsonl
          stable-asr asr-collections --registry configs/references/asr_collections.json --validate-only
          stable-asr asr-collections --audit-coverage
          stable-asr prepare-asr-manifest --input examples/data/asr_metadata.tsv --output /tmp/stable-asr-asr.jsonl --audio-root examples/data --sample-rate 16000
          stable-asr asr-to-turn --input /tmp/stable-asr-asr.jsonl --output /tmp/stable-asr-asr-turn.jsonl --include-incomplete
          stable-asr bootstrap-turn-data --input examples/data/asr_metadata.tsv --output-dir /tmp/stable-asr-bootstrap --audio-root examples/data --sample-rate 16000 --include-incomplete
          stable-asr audit-turn-splits --train /tmp/stable-asr-bootstrap/splits/turn_train.jsonl --dev /tmp/stable-asr-bootstrap/splits/turn_dev.jsonl --test /tmp/stable-asr-bootstrap/splits/turn_test.jsonl
          stable-asr make-synthetic-turn-data --output /tmp/stable-asr-synth.jsonl --episodes 3 --write-audio
          stable-asr audit-audio --kind turn --manifest /tmp/stable-asr-synth.jsonl
          stable-asr eval-turn --dataset examples/data/turn_demo.jsonl --baseline vad_pause
          stable-asr predict-turn --dataset examples/data/turn_demo.jsonl --baseline text_turn --output /tmp/stable-asr-text-turn-predictions.jsonl
          stable-asr validate-turn-predictions --dataset examples/data/turn_demo.jsonl --predictions /tmp/stable-asr-text-turn-predictions.jsonl
          stable-asr compare-turn --dataset examples/data/turn_demo.jsonl --baseline vad_pause --baseline text_turn --predictions oracle=tests/fixtures/turn_predictions_sample.jsonl --report /tmp/stable-asr-turn-compare.md
          stable-asr compare-turn-splits --train /tmp/stable-asr-splits/turn_train.jsonl --dev /tmp/stable-asr-splits/turn_dev.jsonl --test /tmp/stable-asr-splits/turn_test.jsonl --baseline vad_pause --baseline text_turn --report /tmp/stable-asr-turn-split-compare.md
          stable-asr benchmark-pack --output-dir /tmp/stable-asr-benchmark-pack
          cd /tmp/stable-asr-benchmark-pack
          bash commands.sh
          cd "$GITHUB_WORKSPACE"
          stable-asr adapter-pack --output-dir /tmp/stable-asr-adapter-pack
          stable-asr scenario-pack --output-dir /tmp/stable-asr-scenario-pack
          cd /tmp/stable-asr-scenario-pack
          bash commands.sh
          cd "$GITHUB_WORKSPACE"
      - name: Smoke test wheel install
        run: |
          python -m pip wheel . --no-deps -w /tmp/stable-asr-wheel
          python -m venv /tmp/stable-asr-wheel-venv
          /tmp/stable-asr-wheel-venv/bin/python -m pip install --no-deps /tmp/stable-asr-wheel/*.whl
          mkdir -p /tmp/stable-asr-wheel-work
          cd /tmp/stable-asr-wheel-work
          /tmp/stable-asr-wheel-venv/bin/stable-asr doctor
          /tmp/stable-asr-wheel-venv/bin/stable-asr roadmap-status --roadmap configs/roadmap/stable_asr_roadmap.json --validate-only
          /tmp/stable-asr-wheel-venv/bin/stable-asr asr-collections --registry configs/references/asr_collections.json --audit-coverage
          /tmp/stable-asr-wheel-venv/bin/stable-asr paper-release-smoke --output-dir /tmp/stable-asr-wheel-release-smoke --episodes 9 --seed 6 --skip-train

  optional-data-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lance data backend
        run: python -m pip install -e ".[lance]"
      - name: Smoke test optional data backends
        run: |
          stable-asr doctor
          stable-asr benchmark-data --dataset examples/data/turn_demo.jsonl --output-dir /tmp/stable-asr-data-backends --formats jsonl parquet lance --sample-count 16
          stable-asr paper-release-smoke --output-dir /tmp/stable-asr-lance-release-smoke --episodes 9 --seed 6 --skip-train
