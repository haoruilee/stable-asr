[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-asr"
version = "0.0.0"
description = "Reproducible research platform for real-time ASR systems and full-duplex turn-taking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Stable-ASR Contributors" }
]
keywords = [
  "asr",
  "speech",
  "streaming-asr",
  "turn-taking",
  "endpointing",
  "full-duplex",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.0",
]
data = [
  "pyarrow>=14",
]
lance = [
  "pyarrow>=14",
  "pylance>=0.39.0",
]
export = [
  "torch>=2.0",
  "onnx>=1.15",
]
all = [
  "torch>=2.0",
  "onnx>=1.15",
  "pyarrow>=14",
  "pylance>=0.39.0",
]

[project.urls]
Homepage = "https://github.com/stable-asr/stable-asr"
Roadmap = "https://github.com/stable-asr/stable-asr/blob/main/ROADMAP.md"

[project.scripts]
stable-asr = "stable_asr.cli:main"

[tool.setuptools.packages.find]
include = ["stable_asr*"]

[tool.setuptools.data-files]
"share/stable-asr" = ["README.md", "ROADMAP.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "CITATION.cff", "MANIFEST.in", "pyproject.toml", "mkdocs.yaml"]
"share/stable-asr/.github/workflows" = [".github/workflows/*.yml"]
"share/stable-asr/configs/adapters" = ["configs/adapters/*.json"]
"share/stable-asr/configs/benchmarks" = ["configs/benchmarks/*.json"]
"share/stable-asr/configs/datasets" = ["configs/datasets/*.json"]
"share/stable-asr/configs/final" = ["configs/final/*.json"]
"share/stable-asr/configs/paper" = ["configs/paper/*.json"]
"share/stable-asr/configs/references" = ["configs/references/*.json"]
"share/stable-asr/configs/roadmap" = ["configs/roadmap/*.json"]
"share/stable-asr/configs/scenarios" = ["configs/scenarios/*.json"]
"share/stable-asr/configs" = ["configs/*.json"]
"share/stable-asr/docs" = ["docs/*.md"]
"share/stable-asr/docs/api" = ["docs/api/*.md"]
"share/stable-asr/docs/guides" = ["docs/guides/*.md"]
"share/stable-asr/examples/commands" = ["examples/commands/*.py"]
"share/stable-asr/examples/configs" = ["examples/configs/*.json"]
"share/stable-asr/examples/data" = ["examples/data/*.jsonl", "examples/data/*.tsv"]
"share/stable-asr/scripts" = ["scripts/*.py"]
"share/stable-asr/tests/fixtures" = ["tests/fixtures/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
